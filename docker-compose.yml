services:
  mysql:
    image: mysql:8.4
    container_name: tinypet-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: tinypet
    volumes:
      - tinypet-mysql:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
volumes:
  tinypet-mysql:
