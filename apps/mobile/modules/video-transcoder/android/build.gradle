apply plugin: 'com.android.library'

group = 'expo.modules.videotranscoder'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()
useExpoPublishing()

android {
  namespace "expo.modules.videotranscoder"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

// Media3 Transformer: H.264/AAC re-encode with Presentation (exact frame + center crop),
// FrameDropEffect (≤ 30 fps) and explicit video/audio encoder bitrates. 1.5.x supports minSdk 21, compileSdk 35.
def media3Version = "1.5.1"

dependencies {
  implementation "androidx.media3:media3-transformer:$media3Version"
  implementation "androidx.media3:media3-effect:$media3Version"
  implementation "androidx.media3:media3-common:$media3Version"
  implementation "androidx.annotation:annotation-experimental:1.4.1"
}
